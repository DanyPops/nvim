name: ci

on:
  push:
    branches: [main, stem]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2

      - name: Cache lazy.nvim plugins
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim/lazy
          key: lazy-${{ hashFiles('lazy-lock.json') }}
          restore-keys: lazy-

      - name: Bootstrap plugins
        run: |
          nvim --headless -c "lua require('lazy').sync()" -c "qa" || true

      - name: Smoke (startup errors)
        run: make smoke

      - name: Test (mini.test suite)
        run: make test
